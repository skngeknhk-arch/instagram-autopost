name: Instagram daily post
on:
  schedule:
    - cron: '7 10 * * *'   # 毎日 19:07 JST（UTC 10:07）。GitHubの混雑で数分〜数十分遅れることがあります
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = 投稿せず確認だけ'
        default: '1'
permissions:
  contents: write
concurrency: instagram-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.facebook.com' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
        run: python post.py
      - name: Save progress
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "posted $(date -u +%F)" && git push)
